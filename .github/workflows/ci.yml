name: ci

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]

permissions:
    contents: read

jobs:
    test:
        name: tests (py${{ matrix.python-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        
        steps:
            -   uses: actions/checkout@v5
            -   uses: actions/setup-python@v6
                with:
                    python-version: ${{ matrix.python-version }}
            -   name: Install package + dev dependencies
                run: |
                    python -m pip install --upgrade pip
                    pip install -e .[dev]
            -   name: Run tests
                if: matrix.python-version != '3.14'
                run: pytest -q
            -   name: Run tests with coverage
                if: matrix.python-version == '3.14'
                run: pytest -q --cov=wowdata --cov-report=xml
            -   name: Upload coverage reports to Codecov
                if: matrix.python-version == '3.14' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
                uses: codecov/codecov-action@v5
                with:
                    token: ${{ secrets.CODECOV_TOKEN }}
                    slug: sci2pro/wowdata
                    files: ./coverage.xml
                    fail_ci_if_error: true
